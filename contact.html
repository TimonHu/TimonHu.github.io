<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    
    <title>Contact</title>
    <script>
    fetch("html/nav.html")
        .then(r => r.text())
        .then(html => {
            document.getElementById("navbar").innerHTML = html;
        });
    </script>
</head>
<body class="bg-dark">
    <div id="navbar"></div>

    <section id="contact" class="bg-dark text-white py-5">
        <div class="container">
            <div class="row">
                <div class="col-lg-5 mb-4">
                    <h2>Contact</h2>
                    <p>Ben je klaar voor een nieuw project of wil je samenwerken? Stuur een bericht en ik neem snel contact op.</p>

                    <ul class="list-unstyled">
                        <li><strong>Email:</strong> <a href="mailto:example@domein.nl" class="text-white">example@domein.nl</a></li>
                        <li><strong>Telefoon:</strong> <a href="tel:+31612345678" class="text-white">+31 6 12 34 56 78</a></li>
                        <li><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/yourprofile" target="_blank" class="text-white">linkedin.com/in/yourprofile</a></li>
                        <li><strong>GitHub:</strong> <a href="https://github.com/TimonHu" target="_blank" class="text-white">github.com/TimonHu</a></li>
                    </ul>
                </div>

                <div class="col-lg-7">
                    <form id="contactForm" class="bg-light text-dark p-4 rounded" onsubmit="handleContactSubmit(event)">
                        <div class="mb-3">
                            <label for="name" class="form-label">Naam</label>
                            <input type="text" class="form-control" id="name" placeholder="Jouw naam" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" placeholder="jouw@email.nl" required>
                        </div>

                        <div class="mb-3">
                            <label for="subject" class="form-label">Onderwerp</label>
                            <input type="text" class="form-control" id="subject" placeholder="Kort onderwerp">
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">Bericht</label>
                            <textarea id="message" class="form-control" rows="5" required placeholder="Vertel kort waar het over gaat"></textarea>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-primary">Verstuur</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-4 text-center">
        <div class="container text-muted"><p class="text-white">© 2026 Timon Hu. Portfolio.</p></div>
    </footer>

    <script>
    function handleContactSubmit(e){
        e.preventDefault();
        var name = document.getElementById('name').value.trim();
        var email = document.getElementById('email').value.trim();
        var subject = document.getElementById('subject').value.trim() || 'Contact via website';
        var message = document.getElementById('message').value.trim();
        var body = 'Naam: ' + name + '\nE-mail: ' + email + '\n\n' + message;
        var mailto = 'mailto:example@domein.nl?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        window.location.href = mailto;
    }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</body>
</html>
